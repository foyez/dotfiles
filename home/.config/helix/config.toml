theme = "catppuccin_mocha" # or "onedark", "gruvbox", "nord" — see :theme <tab>

[editor]
auto-format = true
auto-pairs = true
auto-save = false 
bufferline = "multiple"
color-modes = true # different cursor color per mode — huge for spotting mode at a glance
completion-trigger-len = 1
cursorline = true
default-line-ending = "lf"
end-of-line-diagnostics = "hint"
idle-timeout = 200
# line-number = "relative"
mouse = true
rulers = [80, 120]
scrolloff = 8
true-color = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true
character = "┊"

[editor.file-picker]
hidden = false # show dotfiles — e.g., .env, .helix, .github
git-ignore = true

[editor.statusline]
# left = ["mode", "spinner", "version-control", "file-name"]
# center = ["file-modification-indicator"]
# right = ["diagnostics", "selections", "position", "file-encoding", "file-line-ending"]

[editor.lsp]
display-messages = true
# display-inlay-hints = true
display-signature-help-docs = true

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.soft-wrap]
enable = true               # good for Markdown/YAML prose
max-wrap = 25
wrap-indicator = ""

[keys.normal.space]
i = ":toggle lsp.display-inlay-hints"
