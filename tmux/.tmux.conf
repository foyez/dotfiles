# Remap prefix from C-b to C-a (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse support: click to select pane, drag to resize, scroll to scroll
set -g mouse on

# Start windows/panes numbered from 1, not 0 (matches keyboard order)
set -g base-index 1
setw -g pane-base-index 1

# Reload config without restarting tmux
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# More intuitive split keys (keep muscle memory of - and | for split direction)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New panes/windows open in the same directory as the current pane
bind c new-window -c "#{pane_current_path}"

# Vi-style keys in copy mode
setw -g mode-keys vi

# Larger scrollback buffer
set -g history-limit 50000

# Faster escape (fixes vim/helix Esc lag inside tmux)
set -sg escape-time 0

# Renumber windows automatically when one is closed
set -g renumber-windows on

# Status bar: keep it simple and informative
set -g status-style bg=default
set -g status-left "#[bold]#S "
set -g status-right "%H:%M %d-%b"
setw -g window-status-current-style bold

# True color support (matters for Helix themes rendering correctly inside tmux)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"